an x="350.0" dy="18">получателя, сумму и</tspan><tspan x="350.0" dy="18">комментарий</tspan></text><rect x="530.0" y="137.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="620.0" y="169.0"><tspan x="620.0" dy="0">Подтвердить перенос</tspan><tspan x="620.0" dy="18">РОПом</tspan></text><rect x="810.0" y="297.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="900.0" y="329.0"><tspan x="900.0" dy="0">Перечитать обе карточки</tspan><tspan x="900.0" dy="18">и проверить условия</tspan></text><path d="M1130.0 310.0 L1155.0 335.0 L1130.0 360.0 L1105.0 335.0 Z" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="22" x="1130.0" y="340.0"><tspan x="1130.0" dy="0">×</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="13" x="1130.0" y="383.0"><tspan x="1130.0" dy="0">Проверка пройдена?</tspan></text><circle cx="1130.0" cy="175.0" r="18" fill="white" stroke="#334155" stroke-width="4"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="1130.0" y="207.0"><tspan x="1130.0" dy="0">Отказ; карточки не</tspan><tspan x="1130.0" dy="18">изменены</tspan></text><rect x="1300.0" y="457.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="1390.0" y="480.0"><tspan x="1390.0" dy="0">Создать операцию в</tspan><tspan x="1390.0" dy="18">ожидании с уникальным</tspan><tspan x="1390.0" dy="18">ID</tspan></text><rect x="1550.0" y="457.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="1640.0" y="489.0"><tspan x="1640.0" dy="0">Записать зачёт и</tspan><tspan x="1640.0" dy="18">проверить обе карточки</tspan></text><path d="M1880.0 470.0 L1905.0 495.0 L1880.0 520.0 L1855.0 495.0 Z" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="22" x="1880.0" y="500.0"><tspan x="1880.0" dy="0">×</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="13" x="1880.0" y="534.0"><tspan x="1880.0" dy="0">Обе записи</tspan><tspan x="1880.0" dy="18">подтверждены?</tspan></text><rect x="1990.0" y="457.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="2080.0" y="489.0"><tspan x="2080.0" dy="0">Завершить журнал;</tspan><tspan x="2080.0" dy="18">пересчитать статусы</tspan></text><circle cx="2240.0" cy="495.0" r="18" fill="white" stroke="#334155" stroke-width="4"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="2240.0" y="536.0"><tspan x="2240.0" dy="0">Перенос подтверждён</tspan></text><rect x="1780.0" y="297.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="1870.0" y="320.0"><tspan x="1870.0" dy="0">Зафиксировать ошибку;</tspan><tspan x="1870.0" dy="18">восстановить</tspan><tspan x="1870.0" dy="18">согласованность</tspan></text><circle cx="2110.0" cy="335.0" r="18" fill="white" stroke="#334155" stroke-width="4"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="2110.0" y="367.0"><tspan x="2110.0" dy="0">Требуется</tspan><tspan x="2110.0" dy="18">восстановление</tspan></text></svg>