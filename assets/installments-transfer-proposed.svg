<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="640" viewBox="0 0 2340 640" role="img" font-family="Arial, sans-serif"><title>Подтверждённый перенос переплаты между карточками</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><text text-anchor="middle" fill="#202d3a" font-size="22" x="1170.0" y="35"><tspan x="1170.0" dy="0">Подтверждённый перенос переплаты между карточками</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="15" x="1170.0" y="65"><tspan x="1170.0" dy="0">Предлагаемая доработка, не реализована</tspan></text><rect x="60" y="95" width="2250" height="160" fill="#f6f8fb" stroke="#ccd4de"/><g transform="translate(90,175) rotate(-90)"><text text-anchor="middle" fill="#202d3a" font-size="12" x="0" y="0"><tspan x="0" dy="0">РОП</tspan></text></g><rect x="60" y="255" width="2250" height="160" fill="#ffffff" stroke="#ccd4de"/><g transform="translate(90,335) rotate(-90)"><text text-anchor="middle" fill="#202d3a" font-size="12" x="0" y="0"><tspan x="0" dy="0">Приложение</tspan></text></g><rect x="60" y="415" width="2250" height="160" fill="#f6f8fb" stroke="#ccd4de"/><g transform="translate(90,495) rotate(-90)"><text text-anchor="middle" fill="#202d3a" font-size="12" x="0" y="-9"><tspan x="0" dy="0">Bitrix24 и журнал</tspan><tspan x="0" dy="18">операций</tspan></text></g><rect x="30" y="95" width="30" height="480" fill="#ecf1f7" stroke="#ccd4de"/><polyline points="158.0,175.0 260.0,175.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="440.0,175.0 530.0,175.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="710.0,175.0 760.0,175.0 760.0,335.0 810.0,335.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="990.0,335.0 1105.0,335.0" f