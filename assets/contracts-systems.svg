<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1214" viewBox="0 0 960 1214" role="img" font-family="Arial, sans-serif"><title>Запуск договора — проектное взаимодействие систем</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><text text-anchor="middle" fill="#202d3a" font-size="21" x="480.0" y="30"><tspan x="480.0" dy="0">Запуск договора — проектное взаимодействие систем</tspan></text><rect x="14.0" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="110.0" y="91"><tspan x="110.0" dy="0">Карточка в браузере</tspan></text><path d="M110.0 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><rect x="260.66666666666663" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="356.66666666666663" y="91"><tspan x="356.66666666666663" dy="0">PHP приложения</tspan></text><path d="M356.66666666666663 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><rect x="507.33333333333326" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="603.3333333333333" y="91"><tspan x="603.3333333333333" dy="0">MySQL приложения</tspan></text><path d="M603.3333333333333 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><rect x="754.0" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="850.0" y="91"><tspan x="850.0" dy="0">Bitrix24 REST</tspan></text><path d="M850.0 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><path d="M110.0 170 H356.66666666666663" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="233.33333333333331" y="140"><tspan x="233.33333333333331" dy="0">Инициатор отправляет данные</tspan><tspan x="233.33333333333331" dy="18">карточки</tspan></text><path d="M356.66666666666663 250 H603.3333333333333" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="479.99999999999994" y="220"><tspan x="479.99999999999994" dy="0">Проверить права; сохранить ожидание</tspan><tspan x="479.99999999999994" dy="18">запуска и событие</tspan></text><path d="M356.66666666666663 330 H850.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="603.3333333333333" y="318"><tspan x="603.3333333333333" dy="0">Создать только персональную задачу ГД</tspan></text><path d="M356.66666666666663 410 H110.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="233.33333333333331" y="398"><tspan x="233.33333333333331" dy="0">Вернуть карточку в ожидании решения</tspan></text><path d="M110.0 490 H356.66666666666663" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="233.33333333333331" y="478"><tspan x="233.33333333333331" dy="0">ГД подтверждает Запустить</tspan></text><path d="M356.66666666666663 570 H603.3333333333333" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="479.99999999999994" y="522"><tspan x="479.99999999999994" dy="0">Проверить состояние; транзакция:</tspan><tspan x="479.99999999999994" dy="18">снимок, раунд, событие, задания</tspan><tspan x="479.99999999999994" dy="18">интеграции</tspan></text><path d="M603.3333333333333 650 H356.66666666666663" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="479.99999999999994" y="638"><tspan x="479.99999999999994" dy="0">Подтвердить транзакцию</tspan></text><path d="M356.66666666666663 730 H850.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="603.3333333333333" y="718"><tspan x="603.3333333333333" dy="0">Создать чат и задачи первого этапа</tspan></text><path d="M850.0 810 H356.66666666666663" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="603.3333333333333" y="798"><tspan x="603.3333333333333" dy="0">Вернуть ID объектов или ошибку</tspan></text><path d="M356.66666666666663 890 H603.3333333333333" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="479.99999999999994" y="860"><tspan x="479.99999999999994" dy="0">Сохранить ID и результат попытки;</tspan><tspan x="479.99999999999994" dy="18">при ошибке — ожидание повтора</tspan></text><path d="M356.66666666666663 970 H110.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="233.33333333333331" y="940"><tspan x="233.33333333333331" dy="0">Показать состояние договора и</tspan><tspan x="233.33333333333331" dy="18">интеграции</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="13" x="480.0" y="1060"><tspan x="480.0" dy="0">Конкретные REST-методы задач и чата в требованиях пока не определены.</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="13" x="480.0" y="1098"><tspan x="480.0" dy="0">MySQL и REST не образуют общую транзакцию; повтор должен исключать дубликаты.</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="13" x="480.0" y="1136"><tspan x="480.0" dy="0">Файлы лежат во внешнем хранилище; здесь сохраняются только ссылки и сведения о версии.</tspan></text></svg>