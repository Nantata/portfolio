" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2040.0,975.0 2100.0,975.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2280.0,975.0 2375.0,975.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2400,950 2400,533" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="12" x="2455" y="935"><tspan x="2455" dy="0">Да</tspan></text><polyline points="2310.0,495.0 2275.0,495.0 2275.0,655.0 2240.0,655.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2060,655 2020,655 2020,815 1790,815" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2425.0,975.0 2560.0,975.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="12" x="2480.0" y="960.0"><tspan x="2480.0" dy="0">Нет</tspan></text><polyline points="2740.0,975.0 2775.0,975.0 2775.0,1135.0 2810.0,1135.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2990.0,1135.0 3052.0,1135.0" fill="none" stroke="#526779" stroke-width="1.7" marker-end="url(#arrow)"/><circle cx="135.0" cy="175.0" r="18" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="135.0" y="216.0"><tspan x="135.0" dy="0">Нужен договор</tspan></text><rect x="210.0" y="137.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="300.0" y="169.0"><tspan x="300.0" dy="0">Заполнить карточку</tspan><tspan x="300.0" dy="18">договора</tspan></text><rect x="450.0" y="297.0" width="180" height="76" rx="9" fill="white" stroke="#334155" stroke-width="1.8"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="540.0" y="329.0"><tspan x="540.0" dy="0">Ре