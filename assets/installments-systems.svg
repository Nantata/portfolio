<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1176" viewBox="0 0 1200 1176" role="img" font-family="Arial, sans-serif"><title>Отчёт рассрочки — взаимодействие по снимку кода</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><text text-anchor="middle" fill="#202d3a" font-size="21" x="600.0" y="30"><tspan x="600.0" dy="0">Отчёт рассрочки — взаимодействие по снимку кода</tspan></text><rect x="14.0" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="110.0" y="91"><tspan x="110.0" dy="0">Интерфейс</tspan></text><path d="M110.0 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><rect x="259.0" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="355.0" y="91"><tspan x="355.0" dy="0">PaymentService</tspan></text><path d="M355.0 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><rect x="504.0" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="600.0" y="91"><tspan x="600.0" dy="0">BitrixDataProvider</tspan></text><path d="M600.0 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><rect x="749.0" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="845.0" y="91"><tspan x="845.0" dy="0">Bitrix24 REST</tspan></text><path d="M845.0 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><rect x="994.0" y="62" width="192" height="54" rx="6" fill="#eef3f8" stroke="#bcc9d6"/><text text-anchor="middle" fill="#202d3a" font-size="14" x="1090.0" y="82"><tspan x="1090.0" dy="0">Расчёт и</tspan><tspan x="1090.0" dy="18">DashboardBuilder</tspan></text><path d="M1090.0 117 V1045" stroke="#9eacb9" stroke-dasharray="5 5"/><path d="M110.0 170 H355.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="232.5" y="140"><tspan x="232.5" dy="0">Запрос отчёта: вкладка, сделка и</tspan><tspan x="232.5" dy="18">фильтры</tspan></text><path d="M355.0 250 H600.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="477.5" y="238"><tspan x="477.5" dy="0">load(criteria)</tspan></text><path d="M600.0 330 H845.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="722.5" y="300"><tspan x="722.5" dy="0">crm.item.list: карточки платежей с</tspan><tspan x="722.5" dy="18">пагинацией</tspan></text><path d="M600.0 410 H845.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="722.5" y="380"><tspan x="722.5" dy="0">crm.deal.list: читаемые сделки в</tspan><tspan x="722.5" dy="18">рассрочке</tspan></text><path d="M600.0 490 H845.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="722.5" y="478"><tspan x="722.5" dy="0">crm.contact.list и batch user.get</tspan></text><path d="M845.0 570 H600.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="722.5" y="558"><tspan x="722.5" dy="0">Данные и предупреждения</tspan></text><path d="M600.0 650 H355.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="477.5" y="638"><tspan x="477.5" dy="0">cards, deals, contacts, users</tspan></text><path d="M355.0 730 H1090.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="722.5" y="718"><tspan x="722.5" dy="0">calculate: группировка, остатки, виртуальный кредит</tspan></text><path d="M355.0 810 H1090.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="722.5" y="798"><tspan x="722.5" dy="0">build: показатели и фильтры отчёта</tspan></text><path d="M1090.0 890 H355.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="722.5" y="878"><tspan x="722.5" dy="0">Готовые строки и итоговые показатели</tspan></text><path d="M355.0 970 H110.0" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><text text-anchor="middle" fill="#202d3a" font-size="13" x="232.5" y="940"><tspan x="232.5" dy="0">Отчёт; стадии CRM и расчётные</tspan><tspan x="232.5" dy="18">признаки отдельно</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="13" x="600.0" y="1060"><tspan x="600.0" dy="0">В этом пути не обнаружена запись зачёта, смена стадии CRM или завершение задачи.</tspan></text><text text-anchor="middle" fill="#202d3a" font-size="13" x="600.0" y="1098"><tspan x="600.0" dy="0">Неподтверждённый расчёт отчёта нельзя считать подтверждённой операцией CRM.</tspan></text></svg>